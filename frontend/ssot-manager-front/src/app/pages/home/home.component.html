<mat-toolbar color="primary">
  SSOT Manager
</mat-toolbar>

<div class="container">

  <h2>Usuários cadastrados</h2>

  <mat-card *ngFor="let usuario of usuarios" class="usuario-card">

    <mat-card-header>
      <mat-card-title>
        {{ usuario.nome }}
      </mat-card-title>

      <mat-card-subtitle>
        {{ usuario.email }}
      </mat-card-subtitle>
    </mat-card-header>

  </mat-card>

</div>
